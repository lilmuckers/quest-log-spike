# Push spike: send one Web Push to every device in spike/notify.json, with the settings the
# notify module will use. Run it from the Actions tab after registering devices on the spike page.
name: Send push
on:
  workflow_dispatch:
    inputs:
      title: { description: Title, default: 'Quest Log spike' }
      body: { description: Body, default: 'Hello from the runner.' }
      urgency: { description: Urgency, type: choice, options: [normal, high, low, very-low], default: normal }
      only: { description: Only this device id (blank for all), default: '' }
permissions: { contents: read }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Offline encryption check
        run: npm run -s test:send
      - name: Send
        env:
          # Named, not toJSON(secrets): GitHub holds toJSON(secrets) workflows for approval (A0 finding).
          SECRETS_JSON: '{"QUEST_VAPID_PRIVATE_KEY": "${{ secrets.QUEST_VAPID_PRIVATE_KEY }}"}'
          PUSH_TITLE: ${{ inputs.title }}
          PUSH_BODY: ${{ inputs.body }}
          PUSH_URGENCY: ${{ inputs.urgency }}
          PUSH_ONLY: ${{ inputs.only }}
        run: node spike/send.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: quest-status, path: quest-status/, retention-days: 7 }
